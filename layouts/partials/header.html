<header>
  <hr>
  <h1 class="page-title">{{ .Title }}</h1>
  <p class="page-subtitle" >
    {{ with .Params.subtitle }}
      {{ . }}
      {{ if and $.IsPage $.Date }}&ndash;{{ end }}
    {{ end }}

    {{ if $.IsPage }}
      {{ with .Date }}
        {{ .Format "2006.01.02" }}
      {{ end }}
    {{ end }}
  </p>
  <hr>
</header>
